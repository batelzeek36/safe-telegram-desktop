name: Safe Telegram Mac build

# Builds the locked Telegram Desktop for Zach's Mac on GitHub's macOS machines.
# Two jobs so each gets its own 6 hours: the libraries (Qt, ffmpeg, WebRTC, ...) build
# once and live in the Actions cache; later runs only rebuild the app.
# The finished Safe Telegram.app is encrypted with ARTIFACT_KEY before upload, because the
# binary carries the api_id/api_hash and this repo is public.

on:
  push:
    branches: [safe]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/Resources/winrc/**'
      - 'Telegram/SourceFiles/platform/win/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/configure.bat'
  workflow_dispatch:

concurrency:
  group: safe-mac
  cancel-in-progress: true

env:
  PREPARE_PATH: "Telegram/build/prepare/prepare.py"

jobs:

  libraries:
    name: Libraries
    runs-on: macos-latest
    timeout-minutes: 355
    steps:
      - name: Get repository name.
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.REPO_NAME }}

      - name: First set up.
        run: |
          sudo chown -R `whoami`:admin /usr/local/share
          brew update
          brew upgrade || true
          brew install automake libtool meson nasm ninja pkg-config
          sudo mdutil -a -i off
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          sudo sed -i '' '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/ -g//' /opt/homebrew/share/cmake/Modules/Compiler/GNU.cmake

      - name: Restore libraries cache.
        id: restore-libs
        uses: actions/cache/restore@v6
        with:
          path: |
            Libraries
            ThirdParty
          key: safe-libs-${{ hashFiles(format('{0}/{1}', env.REPO_NAME, env.PREPARE_PATH)) }}-${{ github.run_id }}
          restore-keys: |
            safe-libs-${{ hashFiles(format('{0}/{1}', env.REPO_NAME, env.PREPARE_PATH)) }}-
            safe-libs-

      # The prune below used to delete Libraries/local/src (wallet_engine.cpp, generated by the
      # tdesktop_rust stage, which the app build compiles). A cache saved that way has the stage keys
      # but not the file, and the stage's own sources were pruned too, so drop all three stages and
      # let prepare re-clone and rebuild them (minutes, not the whole library set).
      - name: Repair a cache without wallet_engine.cpp.
        run: |
          if [ -d Libraries/cache_keys ] && [ ! -f Libraries/local/src/wallet_engine/wallet_engine.cpp ]; then
            echo "wallet_engine.cpp missing from the cache: rebuilding tlottie, wallet-engine, tdesktop_rust"
            rm -rf Libraries/tlottie Libraries/wallet-engine Libraries/tdesktop_rust
            rm -f Libraries/cache_keys/tlottie Libraries/cache_keys/wallet-engine Libraries/cache_keys/tdesktop_rust
          fi

      - name: Library state before.
        run: echo "LIBS_BEFORE=$(ls -R Libraries/cache_keys 2>/dev/null | shasum | cut -c1-16)" >> $GITHUB_ENV

      # Stops short of the job limit so a partial build still gets cached and the next
      # run picks up where this one stopped.
      - name: Libraries.
        id: libs
        timeout-minutes: 320
        run: ./$REPO_NAME/Telegram/build/prepare/mac.sh silent

      - name: Free up some disk space.
        if: always()
        run: find Libraries '(' '(' ! '(' -name '*.a' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/local/src/*' -o -perm +111 ')' -type f ')' -o -empty ')' -delete || true

      - name: Library state after.
        if: always()
        run: echo "LIBS_AFTER=$(ls -R Libraries/cache_keys 2>/dev/null | shasum | cut -c1-16)" >> $GITHUB_ENV

      - name: Save libraries cache.
        if: always() && env.LIBS_AFTER != env.LIBS_BEFORE
        uses: actions/cache/save@v6
        with:
          path: |
            Libraries
            ThirdParty
          key: safe-libs-${{ hashFiles(format('{0}/{1}', env.REPO_NAME, env.PREPARE_PATH)) }}-${{ github.run_id }}

  app:
    name: Telegram Desktop
    needs: libraries
    runs-on: macos-latest
    timeout-minutes: 355
    steps:
      - name: Get repository name.
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.REPO_NAME }}

      - name: First set up.
        run: |
          sudo chown -R `whoami`:admin /usr/local/share
          brew update
          brew upgrade || true
          brew install automake libtool meson nasm ninja pkg-config
          sudo mdutil -a -i off
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          sudo sed -i '' '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/ -g//' /opt/homebrew/share/cmake/Modules/Compiler/GNU.cmake

      - name: Restore libraries cache.
        uses: actions/cache/restore@v6
        with:
          path: |
            Libraries
            ThirdParty
          key: safe-libs-${{ hashFiles(format('{0}/{1}', env.REPO_NAME, env.PREPARE_PATH)) }}-${{ github.run_id }}
          restore-keys: |
            safe-libs-${{ hashFiles(format('{0}/{1}', env.REPO_NAME, env.PREPARE_PATH)) }}-
          fail-on-cache-miss: true

      # The trust list and the picture-check key, like the phone build's
      # assets/safe_trust.json and api.env: into the sources, never into git.
      # Without the secrets the app fails closed (only Saved Messages and
      # Telegram's service account show) and the build still works; a trust
      # secret that is set but malformed stops the build here.
      - name: Trust list and picture-check key.
        env:
          SAFE_TRUST_JSON: ${{ secrets.SAFE_TRUST_JSON }}
          SAFE_JUDGE_KEY: ${{ secrets.SAFE_JUDGE_KEY }}
          SAFE_CALM_URL: ${{ secrets.SAFE_CALM_URL }}
          SAFE_CALM_KEY: ${{ secrets.SAFE_CALM_KEY }}
        run: python3 $REPO_NAME/.github/safe/inject_secrets.py $REPO_NAME

      - name: Build.
        timeout-minutes: 330
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          cd $REPO_NAME/Telegram
          ./configure.sh \
            -D CMAKE_CONFIGURATION_TYPES=Release \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -D TDESKTOP_API_ID="$TDESKTOP_API_ID" \
            -D TDESKTOP_API_HASH="$TDESKTOP_API_HASH" \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
          cmake --build ../out --config Release --parallel

      # Same as the official release script: strip the executable (1.7 GB with symbols).
      - name: Strip.
        run: |
          cd "$REPO_NAME/out/Release"
          du -sh "JADELEAF.app"
          strip "JADELEAF.app/Contents/MacOS/JADELEAF"
          du -sh "JADELEAF.app"
          lipo -archs "JADELEAF.app/Contents/MacOS/JADELEAF"

      - name: Encrypt.
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
        run: |
          cd $REPO_NAME/out/Release
          tar -czf - "JADELEAF.app" | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -pass env:ARTIFACT_KEY -out "$GITHUB_WORKSPACE/safe-telegram-mac.tgz.enc"
          shasum -a 256 "$GITHUB_WORKSPACE/safe-telegram-mac.tgz.enc"

      - name: Upload.
        uses: actions/upload-artifact@v7
        with:
          name: safe-telegram-mac
          path: safe-telegram-mac.tgz.enc
          retention-days: 3
